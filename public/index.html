<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>B0's First Server</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #5c6370;
      --accent: #4f46e5;
      --border: #e5e7eb;
      --nav-bg: rgba(255, 255, 255, 0.85);
      --accent-soft: #eef0ff;
      --shadow: rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Nav bar */
    .navbar {
      position: sticky;
      top: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      list-style: none;
    }

    .nav-links a {
      display: block;
      padding: 8px 14px;
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      background: var(--accent-soft);
      color: var(--accent);
      outline: none;
    }

    .nav-links a.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Main content */
    main {
      max-width: 960px;
      margin: 64px auto;
      padding: 0 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px;
      box-shadow: 0 1px 3px var(--shadow);
    }

    h1 {
      font-size: 2.25rem;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    p { color: var(--muted); margin-bottom: 8px; }

    @media (max-width: 560px) {
      .nav-inner { padding: 0 16px; }
      .nav-links a { padding: 6px 10px; }
      .card { padding: 28px; }
      h1 { font-size: 1.75rem; }
    }
  </style>
  <link rel="stylesheet" href="/dark.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="brand">B0</a>
      <ul class="nav-links">
        <li><a href="/" class="active">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="card">
      <h1>Welcome to My Server</h1>
      <p>This page is being served by Node.js and Express.</p>
      <p>I built this myself!</p>
    </section>
  </main>
</body>
</html>
